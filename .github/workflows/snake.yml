name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jnjal
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23800040&color_dots=%23eee6ef%2C%23d9b3c6%2C%23b3668c%2C%23800040%2C%234d0026&duration=60000
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23b03060&color_dots=%2316100f%2C%233d1b2e%2C%236b294d%2C%23964067%2C%23d879a7&duration=60000

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
