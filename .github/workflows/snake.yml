name: Generate Contribution Snake

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jnjal
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23800040&color_dots=%23f0dce5%2C%23c0809d%2C%23a34d73%2C%23800040%2C%234d0026
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23800040&color_dots=%2316000a%2C%23330019%2C%2359002d%2C%23800040%2C%23a60053

      - name: Slow down snake animation
        run: |
          sed -i -E 's/animation:none [0-9.]+ms linear infinite/animation:none 60000ms linear infinite/g; s/animation:none linear [0-9.]+ms infinite/animation:none linear 60000ms infinite/g' dist/*.svg

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
